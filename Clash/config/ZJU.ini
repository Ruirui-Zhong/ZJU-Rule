[custom]

;Tailscale 服务器直连，避免订阅访问被代理接管
ruleset=DIRECT,[]IP-CIDR,100.101.106.44/32,no-resolve
;Plinx 官网优先代理，早于国内直连及 GEOIP
ruleset=🚀 节点选择,https://raw.githubusercontent.com/Ruirui-Zhong/ZJU-Rule/main/Clash/ProxyPriority.list

;谷歌学术与 Google 验证依赖优先匹配，避免落入通用代理或 GoogleCN 直连
ruleset=🔎 学术搜索,https://raw.githubusercontent.com/Ruirui-Zhong/ZJU-Rule/main/Clash/ScholarProxy.list

