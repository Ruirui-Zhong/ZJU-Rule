;合并相同默认行为的应用组，保留全部节点选择、独立校园出口和通用服务切换
custom_proxy_group=🚀 节点选择`select`[]⚡ 高速节点`(^(?!.*(通知|公告|剩余|重置|到期|流量|套餐|更新订阅|无节点可用)).*)
custom_proxy_group=🏠 家宽节点`select`(^(?!.*(通知|公告|剩余|重置|到期|流量|套餐|更新订阅|无节点可用)).*(家宽|中转).*)
