name: Refresh community academic domains
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/sync_community_academic.py
      - .github/workflows/community-academic.yml
permissions:
  contents: write
concurrency:
  group: rule-maintenance
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/sync_community_academic.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate.mjs
      - name: Commit refreshed domain data
        run: |
          git add Clash/CommunityAcademic.list Clash/Providers/CommunityAcademic.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh community academic domain rules'
          git pull --rebase
          git push
